<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>[My ToDo List Gweh]</h1>
    </header>

    <div class="layout-wrapper">
        
        <!-- Panel Kiri: Daftar Tugas (MAIN) -->
        <main class="task-board">
            <h2>Active Quests (Urutan Deadline)</h2>

        </main>
        <aside class="control-panel">
            <section class="add-task">
                <h2>Deploy New Task</h2>
                <form>
                    <div class="input-group">
                        <label>Task Name</label>
                        <input type="text" placeholder="Nama tugas..." required>
                    </div>
                    <div class="input-group split">
                        <div>
                            <label>Start Date</label>
                            <input type="date" required>
                        </div>
                        <div>
                            <label>Deadline</label>
                            <input type="date" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Description</label>
                        <textarea placeholder="Detail operasional..." rows="3"></textarea>
                    </div>
                    <button type="button" class="btn-execute">Add Task</button>
                </form>
            </section>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 IF Pemrograman Web - Muhammad Hanif Musyafa (5025251093)</p>
    </footer>

</body>
</html>
